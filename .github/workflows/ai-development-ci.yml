name: AI development CI

on:
  push:
    paths:
      - 'tools/ai-development/**'
      - '.ai-development/**'
      - '.github/workflows/ai-development-ci.yml'
  pull_request:
    paths:
      - 'tools/ai-development/**'
      - '.ai-development/**'
      - '.github/workflows/ai-development-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate deterministic pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ai-development/package-lock.json

      - name: Install dependencies
        run: npm --prefix tools/ai-development ci

      - name: Typecheck
        run: npm --prefix tools/ai-development run typecheck

      - name: Test
        run: npm --prefix tools/ai-development test

      - name: Build
        run: npm --prefix tools/ai-development run build

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD -- tools/ai-development .ai-development .github/workflows/ai-development-ci.yml

      - name: Check push whitespace
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        # New branches or unavailable pre-force-push history use the whole pipeline tree.
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE_SHA" HEAD -- tools/ai-development .ai-development .github/workflows/ai-development-ci.yml
