# Supabase local development config
# See: https://supabase.com/docs/guides/local-development/cli/config

project_id = "smaran-clinical-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false  # Admin-provisioned accounts only in Phase 1

[storage]
enabled = true

[storage.buckets.audio]
public = false
file_size_limit = "500MB"
allowed_mime_types = ["audio/mpeg", "audio/mp4", "audio/wav", "audio/webm", "audio/ogg"]
